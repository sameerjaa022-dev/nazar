<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NAZAR Reels - Trending</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; color: #fff; font-family: sans-serif; overflow: hidden; }
    .reels-container { height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; }
    .reels-container::-webkit-scrollbar { display: none; }
    .reel-card { height: 100vh; scroll-snap-align: start; position: relative; display: flex; align-items: center; justify-content: center; background: #000; }
    video { width: 100%; height: 100%; object-fit: cover; }
    .audio-btn { position: fixed; top: 15px; right: 15px; z-index: 100; background: rgba(0,0,0,0.5); color: #fff; border: 1px solid #fff; padding: 8px 15px; border-radius: 20px; font-size: 12px; cursor: pointer; }
    .info { position: absolute; bottom: 30px; left: 15px; z-index: 10; text-shadow: 1px 1px 2px #000; }
    .actions { position: absolute; bottom: 80px; right: 15px; z-index: 10; text-align: center; font-size: 24px; }
  </style>
</head>
<body>
  <button class="audio-btn" onclick="toggleAudio()" id="soundBtn">🔊 आवाज़ चालू</button>
  <div class="reels-container" id="feed"></div>

  <script>
    const reels = [
      { src: "https://www.w3schools.com/html/mov_bbb.mp4", user: "Mohabbat_Status", desc: "प्यार की राहों में... ❤️" },
      { src: "https://media.w3.org/2010/05/sintel/trailer.mp4", user: "Breakup_Dard", desc: "टूटा हुआ दिल... 💔" },
      { src: "https://www.w3schools.com/html/movie.mp4", user: "Badmashi_King", desc: "रॉयल अंदाज़, रॉयल स्वैग 😎" },
      { src: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4", user: "Comedy_Blast", desc: "हँसते-हँसते लोट-पोट 😂" },
      { src: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4", user: "Nazar_Special", desc: "NAZAR का नया धमाका 🔥" }
    ];

    const feed = document.getElementById('feed');
    reels.forEach(r => {
      feed.innerHTML += `
        <div class="reel-card">
          <video src="${r.src}" loop playsinline autoplay muted></video>
          <div class="actions">❤️<br>💬<br>🔁</div>
          <div class="info"><h3>@${r.user}</h3><p>${r.desc}</p></div>
        </div>`;
    });

    let isMuted = true;
    function toggleAudio() {
      isMuted = !isMuted;
      document.querySelectorAll('video').forEach(v => v.muted = isMuted);
      document.getElementById('soundBtn').innerText = isMuted ? "🔊 आवाज़ चालू" : "🔇 आवाज़ बंद";
    }

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        let v = e.target.querySelector('video');
        e.isIntersecting ? v.play() : v.pause();
      });
    }, { threshold: 0.6 });
    document.querySelectorAll('.reel-card').forEach(c => observer.observe(c));
  </script>
</body>
</html>
