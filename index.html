<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NAZAR Reels</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; color: #fff; font-family: sans-serif; overflow: hidden; }
    
    .container { height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; }
    .container::-webkit-scrollbar { display: none; }
    
    .card { height: 100vh; scroll-snap-align: start; position: relative; display: flex; align-items: center; justify-content: center; background: #000; }
    
    video { width: 100%; height: 100%; object-fit: cover; }
    
    .btn { position: fixed; top: 15px; right: 15px; z-index: 100; background: rgba(0,0,0,0.7); color: #fff; padding: 10px 20px; border-radius: 20px; border: 1px solid #fff; font-size: 13px; font-weight: bold; cursor: pointer; }
    
    .title { position: absolute; bottom: 30px; left: 20px; z-index: 10; font-size: 16px; text-shadow: 1px 1px 3px rgba(0,0,0,0.9); }
  </style>
</head>
<body>

  <button class="btn" onclick="toggleSound()" id="soundBtn">🔊 आवाज़ चालू करें</button>
  
  <div class="container" id="feed"></div>

  <script>
    // यहाँ आप जितने चाहें मज़ेदार वीडियो के लिंक डाल सकते हैं
    const reelsList = [
      { url: "https://assets.mixkit.co/videos/preview/mixkit-young-woman-looking-at-the-smartphone-41295-large.mp4", text: "✨ ट्रेंडिंग वायरल रील 1" },
      { url: "https://assets.mixkit.co/videos/preview/mixkit-girl-in-neon-lights-playing-with-her-phone-41297-large.mp4", text: "🔥 स्वैग स्टेटस रील 2" },
      { url: "https://assets.mixkit.co/videos/preview/mixkit-stylish-woman-posing-in-a-studio-41298-large.mp4", text: "😎 स्टाइलिश अंदाज़ रील 3" }
    ];

    const feed = document.getElementById('feed');
    reelsList.forEach(item => {
      feed.innerHTML += `
        <div class="card">
          <video src="${item.url}" loop playsinline autoplay muted></video>
          <div class="title">${item.text}</div>
        </div>`;
    });

    let isMuted = true;
    function toggleSound() {
      isMuted = !isMuted;
      document.querySelectorAll('video').forEach(v => v.muted = isMuted);
      document.getElementById('soundBtn').innerText = isMuted ? "🔊 आवाज़ चालू करें" : "🔇 आवाज़ बंद करें";
    }

    // ऑटो-प्ले और स्क्रॉल कंट्रोल
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        let v = e.target.querySelector('video');
        if (e.isIntersecting) {
          v.play().catch(() => {});
        } else {
          v.pause();
          v.currentTime = 0;
        }
      });
    }, { threshold: 0.6 });

    document.querySelectorAll('.card').forEach(c => observer.observe(c));
  </script>
</body>
