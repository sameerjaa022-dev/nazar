<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NAZAR Reels</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; height: 100vh; width: 100vw; display: flex; justify-content: center; align-items: center; }
    
    /* यह कोड वीडियो को बिल्कुल फुल स्क्रीन कर देगा, कोई डिब्बा नहीं दिखेगा */
    video {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
    }
  </style>
</head>
<body>

  <!-- यह छोटी और बढ़िया रील्स वीडियो है जो सीधे फुल स्क्रीन चलेगी -->
  <video id="reelVideo" src="https://assets.mixkit.co/videos/preview/mixkit-young-woman-looking-at-the-smartphone-41295-large.mp4" autoplay loop playsinline muted></video>

  <script>
    // जैसे ही आप स्क्रीन पर कहीं भी टच करेंगे, वीडियो की आवाज़ चालू हो जाएगी
    document.body.addEventListener('click', function() {
      var v = document.getElementById('reelVideo');
      if (v.muted) {
        v.muted = false;
      }
    });
  </script>

</body>
</html>
