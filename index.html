<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NAZAR Reels App</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; color: #fff; font-family: sans-serif; overflow: hidden; }

    /* रील्स का पूरा डिब्बा जो इंस्टाग्राम की तरह स्वाइप होगा */
    .reels-container {
      height: 100vh;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
    }
    .reels-container::-webkit-scrollbar { display: none; }

    /* हर एक रील कार्ड */
    .reel-card {
      height: 100vh;
      width: 100vw;
      scroll-snap-align: start;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    /* वीडियो फुल स्क्रीन */
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* दाईं ओर इंस्टाग्राम जैसे बटन (लाइक, शेयर आदि) */
    .right-actions {
      position: absolute;
      right: 15px;
      bottom: 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      z-index: 10;
    }
    .action-btn {
      background: rgba(0,0,0,0.5);
      border: none;
      color: #fff;
      font-size: 24px;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* नीचे यूजर का नाम और कैप्शन */
    .reel-info {
      position: absolute;
      bottom: 25px;
      left: 15px;
      right: 70px;
      z-index: 10;
    }
    .username { font-weight: bold; font-size: 15px; margin-bottom: 5px; text-shadow: 1px 1px 2px rgba(0,0,0,0.8); }
    .caption { font-size: 13px; opacity: 0.9; text-shadow: 1px 1px 2px rgba(0,0,0,0.8); }

    /* ऊपर आवाज़ चालू/बंद करने का बटन */
    .top-sound-btn {
      position: fixed;
      top: 15px;
      right: 15px;
      z-index: 100;
      background: rgba(0,0,0,0.6);
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.3);
      font-size: 13px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <button class="top-sound-btn" onclick="toggleAudio()" id="soundBtn">🔊 आवाज़ चालू करें</button>

  <div class="reels-container" id="reelFeed"></div>

  <script>
    // यहाँ आप अपनी पसंद की जितनी चाहें रील्स के लिंक और नाम डाल सकते हैं
    const reelsData = [
      {
        src: "https://assets.mixkit.co/videos/preview/mixkit-young-woman-looking-at-the-smartphone-41295-large.mp4",
        user: "@Nazar_Official",
        text: "🔥 पहली ट्रेंडिंग रील - NAZAR स्पेशल"
      },
      {
        src: "https://assets.mixkit.co/videos/preview/mixkit-girl-in-neon-lights-playing-with-her-phone-41297-large.mp4",
        user: "@Nazar_Vibes",
        text: "😎 स्वैग वाला अंदाज़ #trending"
      },
      {
        src: "https://assets.mixkit.co/videos/preview/mixkit-stylish-woman-posing-in-a-studio-41298-large.mp4",
        user: "@Nazar_Style",
        text: "✨ नया वायरल वीडियो 🚀"
      }
    ];

    const feed = document.getElementById('reelFeed');

    reelsData.forEach(item => {
      feed.innerHTML += `
        <div class="reel-card">
          <video src="${item.src}" loop playsinline autoplay muted></video>
          
          <div class="right-actions">
            <button class="action-btn" onclick="this.style.color = this.style.color === 'red' ? '#fff' : 'red'">❤️</button>
            <button class="action-btn">💬</button>
            <button class="action-btn">↗️</button>
          </div>

          <div class="reel-info">
            <div class="username">${item.user}</div>
            <div class="caption">${item.text}</div>
          </div>
        </div>
      `;
    });

    let isMuted = true;
    function toggleAudio() {
      isMuted = !isMuted;
      document.querySelectorAll('video').forEach(v => v.muted = isMuted);
      document.getElementById('soundBtn').innerText = isMuted ? "🔊 आवाज़ चालू करें" : "🔇 आवाज़ बंद करें";
    }

    // जो रील सामने आएगी, सिर्फ वही चलेगी (ऑटो-प्ले)
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        let v = e.target.querySelector('video');
        if (e.isIntersecting) {
          v.play().catch(() => {});
        } else {
          v.pause();
        }
      });
    }, { threshold: 0.6 });

    document.querySelectorAll('.reel-card').forEach(c => observer.observe(c));
  </script>
</body>
</html
