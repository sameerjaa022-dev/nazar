<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NAZAR Reels</title>
  <style>
    body, html { margin: 0; padding: 0; background: #000; height: 100%; overflow: hidden; }
    .container { height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; }
    .box { height: 100vh; scroll-snap-align: start; position: relative; }
    video { width: 100%; height: 100%; object-fit: cover; }
    .play-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; z-index: 10; color: white; font-size: 20px; }
  </style>
</head>
<body>

  <div class="container" id="c">
    <!-- वीडियो 1 -->
    <div class="box">
      <video src="https://www.w3schools.com/html/mov_bbb.mp4" playsinline autoplay loop muted></video>
      <div class="play-overlay" onclick="this.style.display='none'; this.previousElementSibling.play()">▶ टच करें</div>
    </div>
    <!-- वीडियो 2 -->
    <div class="box">
      <video src="https://media.w3.org/2010/05/sintel/trailer.mp4" playsinline autoplay loop muted></video>
      <div class="play-overlay" onclick="this.style.display='none'; this.previousElementSibling.play()">▶ टच करें</div>
    </div>
  </div>

  <script>
    // यह पक्का करेगा कि वीडियो चालू हो जाए
    document.querySelectorAll('video').forEach(vid => {
      vid.play().catch(error => {
        console.log("Auto-play blocked, user interaction needed.");
      });
    });
  </script>
</body>
</html>
