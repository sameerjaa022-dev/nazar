<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NAZAR Reels</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; color: #fff; font-family: sans-serif; overflow: hidden; }
    .container { height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; }
    .card { height: 100vh; width: 100vw; scroll-snap-align: start; position: relative; background: #000; display: flex; align-items: center; justify-content: center; }
    video { width: 100%; height: 100%; object-fit: cover; }
    
    /* ये रहा वो बटन जो वीडियो चलाएगा */
    .play-btn { position: absolute; z-index: 50; padding: 20px 40px; background: rgba(255,0,0,0.8); border: none; color: #fff; font-size: 20px; border-radius: 10px; cursor: pointer; }
  </style>
</head>
<body>

  <div class="container" id="feed"></div>

  <script>
    const videos = [
      "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4",
      "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4"
    ];

    const feed = document.getElementById('feed');
    videos.forEach(src => {
      feed.innerHTML += `
        <div class="card">
          <video src="${src}" loop playsinline></video>
          <button class="play-btn" onclick="this.parentElement.querySelector('video').play(); this.style.display='none'">▶ वीडियो चलाएं</button>
        </div>
      `;
    });
  </script>
</body>
</html>
