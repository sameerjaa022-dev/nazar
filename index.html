<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NAZAR Reels</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; color: #fff; font-family: sans-serif; overflow: hidden; }

    /* ऊपर आवाज़ का बटन */
    .top-bar { position: fixed; top: 12px; right: 15px; z-index: 50; }
    .audio-btn { background: rgba(0,0,0,0.8); color: #fff; border: 1px solid #fff; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: bold; cursor: pointer; }

    /* रील्स फीड */
    .reels-container { height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; }
    .reels-container::-webkit-scrollbar { display: none; }

    .reel-card { height: 100vh; scroll-snap-align: start; position: relative; display: flex; align-items: center; justify-content: center; background: #111; }
    
    /* वीडियो स्टाइल */
    video { width: 100%; height: 100%; object-fit: cover; }

    /* प्ले करने के लिए बड़ा बटन अगर वीडियो रुके तो */
    .play-trigger { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.6); color: #fff; padding: 15px 25px; border-radius: 30px; font-size: 16px; border: 1px solid #fff; z-index: 15; cursor: pointer; }

    /* दाईं तरफ के बटन */
    .right-actions { position: absolute; right: 15px; bottom: 85px; z-index: 10; display: flex; flex-direction: column; align-items: center; gap: 18px; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
    .action-item { background: none; border: none; color: #fff; cursor: pointer; text-align: center; }
    .action-item span { display: block; font-size: 26px; margin-bottom: 2px; }
    .action-item p { font-size: 11px; font-weight: bold; }

    /* नीचे आईडी और कैप्शन */
    .reel-info { position: absolute; bottom: 30px; left: 15px; right: 80px; z-index: 10; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
    .user-profile { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    .avatar { width: 34px; height: 34px; background: #ff0050; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; border: 1px solid #fff; }
    .username { font-size: 14px; font-weight: bold; }
    .follow-btn { font-size: 11px; border: 1px solid #fff; padding: 2px 8px; border-radius: 4px; background: rgba(255,255,255,0.2); cursor: pointer; }
    .caption { font-size: 12px; color: #eee; }
  </style>
</head>
<body>

  <!-- आवाज़ चालू करने का बटन -->
  <div class="top-bar">
    <button class="audio-btn" onclick="toggleAudio()" id="soundBtn">🔊 आवाज़ चालू करें</button>
  </div>

  <div class="reels-container" id="feed">
    
    <!-- रील 1 -->
    <div class="reel-card">
      <video src="https://www.w3schools.com/html/mov_bbb.mp4" loop playsinline autoplay muted></video>
      <div class="play-trigger" onclick="forcePlay(this)">▶ वीडियो चलाएं</div>
      <div class="right-actions">
        <button class="action-item" onclick="this.style.color='#ff2d55'"><span>❤️</span><p>124K</p></button>
        <button class="action-item"><span>💬</span><p>412</p></button>
        <button class="action-item"><span>🔁</span><p>शेयर</p></button>
      </div>
      <div class="reel-info">
        <div class="user-profile">
          <div class="avatar">N</div>
          <span class="username">@nazar_reels_1</span>
          <span class="follow-btn" onclick="this.innerText='फॉलो किया'">फॉलो करें</span>
        </div>
        <div class="caption">इंस्टाग्राम जैसी शानदार और मज़ेदार रील्स सिर्फ NAZAR पर 🔥</div>
      </div>
    </div>

    <!-- रील 2 -->
    <div class="reel-card">
      <video src="https://media.w3.org/2010/05/sintel/trailer.mp4" loop playsinline autoplay muted></video>
      <div class="play-trigger" onclick="forcePlay(this)">▶ वीडियो चलाएं</div>
      <div class="right-actions">
        <button class="action-item" onclick="this.style.color='#ff2d55'"><span>❤️</span><p>85.2K</p></button>
        <button class="action-item"><span>💬</span><p>230</p></button>
        <button class="action-item"><span>🔁</span><p>शेयर</p></button>
      </div>
      <div class="reel-info">
        <div class="user-profile">
          <div class="avatar">G</div>
          <span class="username">@global_trending</span>
          <span class="follow-btn" onclick="this.innerText='फॉलो किया'">फॉलो करें</span>
        </div>
        <div class="caption">बेहतरीन क्वालिटी और बिना रुके चलने वाले वीडियो 🚀</div>
      </div>
    </div>

  </div>

  <script>
    let isMuted = true;

    function toggleAudio() {
      isMuted = !isMuted;
      document.querySelectorAll('video').forEach(v => { v.muted = isMuted; });
      document.getElementById('soundBtn').innerText = isMuted ? "🔊 आवाज़ चालू करें" : "🔇 आवाज़ बंद करें";
    }

    function forcePlay(btn) {
      let card = btn.parentElement;
      let video = card.querySelector('video');
      video.muted = false;
      video.play();
      btn.style.display = 'none';
      isMuted = false;
      document.getElementById('soundBtn').innerText = "🔇 आवाज़ बंद करें";
    }

    // ऑटोमैटिक प्ले और पॉज़ करने के लिए
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        let video = entry.target.querySelector('video');
        let btn = entry.target.querySelector('.play-trigger');
        if (entry.isIntersecting) {
          video.play().then(() => {
            if(btn) btn.style.display = 'none';
          }).catch(() => {
            if(btn) btn.style.display = 'block';
          });
        } else {
          video.pause();
          video.currentTime = 0;
        }
      });
    }, { threshold: 0.6 });

    document.querySelectorAll('.reel-card').forEach(card => observer.observe(card));
  </script>
</body>
</html>
