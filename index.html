<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NAZAR Reels</title>
  <style>
    body { margin: 0; background: #000; overflow: hidden; }
    .video-container { height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; }
    .video-box { height: 100vh; scroll-snap-align: start; position: relative; }
    video { width: 100%; height: 100%; object-fit: cover; }
  </style>
</head>
<body>
  <div class="video-container" id="container"></div>
  <script>
    const videos = [
      "https://assets.mixkit.co/videos/preview/mixkit-tree-with-yellow-flowers-1173-large.mp4",
      "https://assets.mixkit.co/videos/preview/mixkit-mother-with-her-little-daughter-eating-a-marshmallow-in-41394-large.mp4",
      "https://assets.mixkit.co/videos/preview/mixkit-girl-in-neon-sign-1232-large.mp4"
    ];
    const container = document.getElementById('container');
    videos.forEach(src => {
      const div = document.createElement('div');
      div.className = 'video-box';
      div.innerHTML = `<video src="${src}" loop playsinline onclick="this.play()"></video>`;
      container.appendChild(div);
    });
  </script>
</body>
</html>
